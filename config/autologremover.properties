# Auto Log Remover Configuration
#
# deletion-mode: 'days' = delete old files, 'limit' = keep only newest X files
# max-log-days: Delete logs older than X days (mode=days)
# max-log-limit: Keep only X newest log files (mode=limit)
#
enabled=true
deletion-mode=days
max-log-days=3
max-log-limit=3
